<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>Gross Profit Pacing | Rapid Roofing</title>
<style>
  @font-face { font-family: "Barlow Condensed"; font-weight: 800; font-style: normal; font-display: swap; src: url("assets/fonts/barlow-condensed-800.woff2") format("woff2"); }
  @font-face { font-family: "Barlow Condensed"; font-weight: 900; font-style: normal; font-display: swap; src: url("assets/fonts/barlow-condensed-900.woff2") format("woff2"); }
  @font-face { font-family: "Inter"; font-weight: 400 700; font-style: normal; font-display: swap; src: url("assets/fonts/inter-var.woff2") format("woff2"); }
  :root {
    --rapid-red: #FF0000; --pitch-black: #000000; --flash-yellow: #FFFF00; --solar-white: #FFFFFF;
    --page: #F4F2F0; --rule: #E3E1DE; --steel: #777777; --zero: #B8B5B1;
    --success: #12A148; --success-ink: #0B7A33; --success-tint: #EAF6EE;
    --miss-ink: #C20000; --miss-tint: #FDECEC;
    --display: "Barlow Condensed", "Arial Narrow", sans-serif;
    --body: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
    color-scheme: light;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { background: var(--page); color: var(--pitch-black); font-family: var(--body); min-height: 100vh; display: flex; flex-direction: column; }
  .brand { background: var(--rapid-red); color: var(--solar-white); display: flex; align-items: center; gap: 28px; flex-wrap: wrap; padding: max(16px, env(safe-area-inset-top)) 28px 16px; }
  .brand img { height: 40px; width: auto; display: block; }
  .brand h1 { margin: 0; font-family: var(--display); font-weight: 900; font-size: 28px; text-transform: uppercase; letter-spacing: .01em; line-height: 1; }
  .chips { margin-left: auto; display: flex; gap: 10px; }
  .chip { background: var(--flash-yellow); color: var(--pitch-black); border: 2px solid var(--pitch-black); display: flex; align-items: center; }
  .chip .cell { padding: 5px 12px; display: flex; flex-direction: column; justify-content: center; }
  .chip .cell + .cell { border-left: 2px solid var(--pitch-black); }
  .chip small { font-family: var(--display); font-weight: 800; font-size: 10px; text-transform: uppercase; letter-spacing: .08em; }
  .chip b { font-family: var(--display); font-weight: 900; font-size: 17px; line-height: 1.05; }
  main { flex: 1; padding: 20px 28px 24px; display: grid; gap: 18px; align-content: start; grid-template-columns: minmax(0, 1fr); max-width: 1200px; width: 100%; margin: 0 auto; }
  .card { background: var(--solar-white); outline: 1px solid var(--rule); padding: 18px 20px; }
  h2 { margin: 0 0 12px; font-family: var(--display); font-weight: 900; font-size: 20px; text-transform: uppercase; letter-spacing: .02em; }
  .label { font-family: var(--display); font-weight: 800; font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--steel); }
  .big { font-family: var(--display); font-weight: 900; font-size: 44px; line-height: 1; font-variant-numeric: tabular-nums; }
  .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0; }
  .stats > div { padding: 4px 18px; border-left: 1px solid var(--rule); }
  .stats > div:first-child { border-left: 0; padding-left: 0; }
  .good { color: var(--success-ink); } .bad { color: var(--miss-ink); }
  .note { color: var(--steel); font-size: 13px; margin-top: 4px; }

  .bar { position: relative; height: 46px; background: #EFEDEA; margin: 34px 0 40px; }
  .bar .fill { position: absolute; left: 0; top: 0; bottom: 0; background: var(--pitch-black); }
  .bar .est { position: absolute; top: 0; bottom: 0; background: #8A8784; }
  .bar .proj { position: absolute; top: 0; bottom: 0; background: repeating-linear-gradient(135deg, #BDBDBD 0 6px, #D6D4D1 6px 12px); }
  .bar .tick { position: absolute; top: -6px; bottom: -6px; width: 3px; background: var(--rapid-red); }
  .bar .tick span { position: absolute; top: 52px; transform: translateX(-50%); white-space: nowrap; font-family: var(--display); font-weight: 800; font-size: 13px; text-transform: uppercase; text-align: center; line-height: 1.1; }
  .bar .tick span small { display: block; color: var(--steel); font-size: 11px; }
  .bar .pace { position: absolute; top: -10px; bottom: -10px; border-left: 3px dashed var(--flash-yellow); outline: 0; }
  .bar .pace span { position: absolute; bottom: 52px; transform: translateX(-50%); background: var(--flash-yellow); border: 2px solid var(--pitch-black); padding: 1px 6px; white-space: nowrap; font-family: var(--display); font-weight: 800; font-size: 12px; text-transform: uppercase; }
  .legend span { min-width: 0; }
  .legend { display: flex; gap: 22px; flex-wrap: wrap; font-size: 13px; color: var(--steel); }
  .legend i { display: inline-block; width: 14px; height: 14px; vertical-align: -2px; margin-right: 6px; }

  .gates { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
  .gate { border-left: 6px solid var(--success); }
  .gate.fail { border-left-color: var(--rapid-red); background: var(--miss-tint); }
  .gate .status { display: inline-block; font-family: var(--display); font-weight: 900; font-size: 13px; text-transform: uppercase; letter-spacing: .06em; padding: 2px 8px; color: var(--solar-white); background: var(--success-ink); margin-bottom: 8px; }
  .gate.fail .status { background: var(--miss-ink); }

  table { border-collapse: collapse; width: 100%; }
  th, td { padding: 12px 10px; text-align: right; border-bottom: 1px solid var(--rule); white-space: nowrap; }
  th { background: var(--pitch-black); color: var(--solar-white); font-family: var(--display); font-weight: 800; font-size: 14px; text-transform: uppercase; letter-spacing: .03em; }
  th:first-child, td:first-child { text-align: left; }
  td .num { font-family: var(--display); font-weight: 800; font-size: 22px; font-variant-numeric: tabular-nums; }
  td .sub { display: block; color: var(--steel); font-size: 12px; }
  tr.hit td { background: var(--success-tint); }
  .wrap { overflow-x: auto; }

  .tag { display: inline-block; background: #E3E1DE; color: #555; font-size: 10px; letter-spacing: .06em; padding: 1px 5px; vertical-align: 1px; margin-left: 4px; }
  .est-t { color: #6B6865; }
  table.mini th { font-size: 12px; padding: 8px 10px; } table.mini td { font-size: 13px; padding: 8px 10px; color: #333; } table.mini .sub { display: inline; }
  .tiers { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
  .tier { border: 1px solid var(--rule); border-top: 6px solid var(--pitch-black); padding: 14px 16px; }
  .tier.hit { border-top-color: var(--success); background: var(--success-tint); }
  .tier-head { display: flex; justify-content: space-between; align-items: baseline; }
  .tname { font-family: var(--display); font-weight: 900; font-size: 26px; text-transform: uppercase; }
  .tbonus { font-family: var(--display); font-weight: 800; font-size: 16px; color: var(--success-ink); }
  .ask { font-family: var(--display); font-weight: 800; font-size: 22px; line-height: 1.15; margin: 8px 0 10px; text-transform: uppercase; }
  .ask b { color: var(--rapid-red); font-weight: 900; }
  ul.steps { margin: 0; padding-left: 18px; display: grid; gap: 6px; font-size: 14px; line-height: 1.45; color: #333; }
  ul.todo { margin: 0; padding-left: 20px; display: grid; gap: 8px; font-size: 15px; line-height: 1.5; }
  .src { font-size: 12px; color: var(--steel); line-height: 1.6; }
  footer { background: var(--pitch-black); color: var(--solar-white); border-top: 3px solid var(--flash-yellow); display: flex; align-items: center; gap: 28px; flex-wrap: wrap; padding: 10px 28px max(10px, env(safe-area-inset-bottom)); font-family: var(--display); font-weight: 800; font-size: 13px; text-transform: uppercase; letter-spacing: .04em; }
  footer small { color: #9A9A9A; font-size: 10px; letter-spacing: .1em; margin-right: 8px; }
  footer img { height: 22px; margin-left: auto; display: block; }
  @media (max-width: 1050px) { .tiers { grid-template-columns: 1fr; } }
  @media (max-width: 1050px) { .stats { grid-template-columns: 1fr 1fr; } .stats > div:nth-child(3) { border-left: 0; padding-left: 0; } .stats > div { padding-top: 10px; padding-bottom: 10px; } }
  @media (max-width: 760px) {
    .brand, footer { padding-left: 16px; padding-right: 16px; gap: 14px; }
    .chips { margin-left: 0; }
    main { padding: 14px 12px; }
    .stats, .gates, .tiers { grid-template-columns: 1fr; }
    table.mini th, table.mini td { white-space: normal; }
    .stats > div { border-left: 0; padding: 8px 0; border-top: 1px solid var(--rule); }
    .big { font-size: 36px; }
    .bar .tick span { font-size: 10px; } .bar .tick span small { display: none; }
  }
</style>
</head>
<body>
<header class="brand">
  <img src="assets/rapid-logo-white.png" alt="Rapid Roofing">
  <h1>Gross Profit Pacing</h1>
  <div class="chips">
    <div class="chip"><div class="cell"><small>AccuLynx data</small><b id="asof">–</b></div><div class="cell"><small>Quarter</small><b id="qtr">–</b></div><div class="cell"><small>Day</small><b id="day">–</b></div></div>
  </div>
</header>

<main id="app"><div class="card">Loading…</div></main>

<footer>
  <span><small>Refreshed</small><span id="refreshed">–</span></span>
  <span>Rapid Roofing · General Manager · Q bonus on gross profit</span>
  <img src="assets/rapid-r-white.png" alt="">
</footer>

<script>
const $ = id => document.getElementById(id);
const money = n => "$" + Math.round(n).toLocaleString("en-US");
const k = n => Math.abs(n) >= 1e6 ? "$" + (n / 1e6).toFixed(2) + "M" : "$" + Math.round(n / 1000).toLocaleString("en-US") + "K";
const pct = n => (n * 100).toFixed(1) + "%";

function render(d) {
  const t = new Date(d.updated);
  $("asof").textContent = t.toLocaleTimeString("en-US", { timeZone: "America/New_York", hour: "numeric", minute: "2-digit" });
  $("refreshed").textContent = t.toLocaleDateString("en-US", { timeZone: "America/New_York", weekday: "short", month: "short", day: "numeric" });
  $("qtr").textContent = d.quarter;
  $("day").textContent = d.day + " / " + d.days;

  const diff = d.gp_to_date - d.pace_target;
  const max = d.gp_goal * 1.18;
  const at = v => Math.min(100, v / max * 100).toFixed(2) + "%";
  const gm = d.gates.margin, gc = d.gates.close_rate;
  const gatesOk = gm.pass && gc.pass;
  const sched = d.scheduled.value * gm.value;
  const tag = '<span class="tag">Estimate</span>';

  let ticks = d.tiers.map(x => `<div class="tick" style="left:${at(x.gp_target)}"><span>${x.name}<small>${k(x.gp_target)}</small></span></div>`).join("");

  const end = d.quarter_end;
  const schedGP = d.scheduled.value * gm.value;
  let rows = d.tiers.map(x => {
    const head = `<div class="tier-head"><span class="tname">${x.name}</span><span class="tbonus">${money(x.bonus)} bonus</span></div>`;
    if (x.hit) return `<div class="tier hit">${head}<div class="ask good">Reached.</div></div>`;
    const left = Math.max(0, x.gp_needed - schedGP);
    const ask = x.beyond_schedule
      ? `Sell and install <b>${k(x.beyond_schedule)}</b> of new work by ${end}`
      : `Covered if every scheduled job installs by ${end}`;
    const steps = x.beyond_schedule
      ? `<li>We need <b>${k(x.gp_needed)}</b> more gross profit by ${end}.</li>
         <li>The ${d.scheduled.jobs} jobs already on the install schedule (${k(d.scheduled.value)} of work) bring about <b>${k(schedGP)}</b> of that.</li>
         <li>That leaves <b>${k(left)}</b> of gross profit. At our ${pct(gm.value)} margin, that takes <b>${k(x.beyond_schedule)}</b> of new jobs, sold and installed by ${end}.</li>
         <li>That's about <b>${k(x.beyond_schedule / d.weeks_left)}</b> of new work a week for the ${d.weeks_left} weeks left.</li>`
      : `<li>We need <b>${k(x.gp_needed)}</b> more gross profit by ${end}.</li>
         <li>The ${d.scheduled.jobs} jobs already on the install schedule (${k(d.scheduled.value)} of work) bring about <b>${k(schedGP)}</b>, which is enough. Every one of them has to get installed by ${end}.</li>`;
    return `<div class="tier">${head}<div class="ask">${ask}</div><ul class="steps">${steps}</ul></div>`;
  }).join("");

  // Plain directions, built from the numbers.
  const next = d.tiers.find(x => !x.hit);
  const todo = [];
  if (!gc.pass) todo.push(`<b>Close rate is the first fix.</b> The team is at ${pct(gc.value)} and the gate is ${pct(gc.min)}. That is ${gc.sales_short} sales short on today's demos. If the quarter ended today, the bonus would be $0 no matter how much profit came in.`);
  if (!gm.pass) todo.push(`<b>Margin is under the floor.</b> Closed jobs are at ${pct(gm.value)} and the floor is ${pct(gm.min)}. Hold the template pricing and the discount limits.`);
  if (next) todo.push(next.beyond_schedule
      ? `<b>To reach ${next.name}</b> (${money(next.bonus)} bonus), sell and install ${k(next.beyond_schedule)} of new work by ${end}, on top of the ${d.scheduled.jobs} jobs already scheduled. Sold jobs only count once they're installed, so they have to be sold early enough to get on the schedule.`
      : `<b>To reach ${next.name}</b> (${money(next.bonus)} bonus), get every scheduled job installed by ${end}. Protect the schedule.`);
  todo.push(`Every point of margin matters. At ${pct(gm.value)}, each $100K installed adds ${k(100000 * gm.value)} of gross profit. At ${pct(d.gp_goal_pct)}, it would add ${k(100000 * d.gp_goal_pct)}.`);

  const proj = d.projected_gp / d.gp_goal;
  const src = "<table class='mini'><thead><tr><th>Month</th><th>Installed</th><th>Actual GP</th><th>Estimate GP</th></tr></thead><tbody>" + d.months.map(m => `<tr><td>${m.month}${m.source === "P&L" ? " (closed P&L)" : ""}</td><td>${money(m.installed)}</td><td>${money(m.actual_gp)} <span class="sub">${m.source === "P&L" ? "P&L" : m.closed_jobs + " closed jobs"}</span></td><td>${m.estimate_gp ? money(m.estimate_gp) + ' <span class="sub">' + m.open_jobs + " open jobs</span>" : "None"}</td></tr>`).join("") + "</tbody></table>";

  $("app").innerHTML = `
  <section class="card">
    <div class="stats">
      <div><div class="label">Where we should be today</div><div class="big">${k(d.pace_target)}</div><div class="note">${pct(d.day / d.days)} of the ${k(d.gp_goal)} goal</div></div>
      <div><div class="label">Actual · closed jobs</div><div class="big">${k(d.actual_gp)}</div><div class="note">${d.closed_jobs} installed jobs closed, final profit</div></div>
      <div><div class="label">Estimate · not closed yet ${tag}</div><div class="big est-t">+${k(d.estimate_gp)}</div><div class="note">${d.open_jobs} installed jobs (${k(d.open_value)}) at ${pct(gm.value)}</div></div>
      <div><div class="label">${diff >= 0 ? "Ahead of pace" : "Behind pace"} ${tag}</div><div class="big ${diff >= 0 ? "good" : "bad"}">${diff >= 0 ? "+" : "−"}${k(Math.abs(diff))}</div><div class="note">${k(d.gp_to_date)} actual + estimate · ${d.weeks_left} weeks left</div></div>
    </div>
    <div class="bar">
      <div class="fill" style="width:${at(d.actual_gp)}"></div>
      <div class="est" style="left:${at(d.actual_gp)};width:calc(${at(d.gp_to_date)} - ${at(d.actual_gp)})"></div>
      <div class="proj" style="left:${at(d.gp_to_date)};width:calc(${at(d.projected_gp)} - ${at(d.gp_to_date)})"></div>
      ${ticks}
      <div class="pace" style="left:${at(d.pace_target)}"><span>Pace today</span></div>
    </div>
    <div class="legend">
      <span><i style="background:#000"></i>Actual: ${k(d.actual_gp)} (closed jobs)</span>
      <span><i style="background:#8A8784"></i>Estimate: ${k(d.estimate_gp)} (installed, not closed)</span>
      <span><i style="background:repeating-linear-gradient(135deg,#BDBDBD 0 4px,#D6D4D1 4px 8px)"></i>Estimate if the install schedule holds: +${k(sched)} → ${k(d.projected_gp)} (${pct(proj)} of goal)</span>
      <span><i style="background:var(--rapid-red)"></i>Bonus lines</span>
    </div>
  </section>

  <section class="gates">
    <div class="card gate ${gc.pass ? "" : "fail"}">
      <span class="status">${gc.pass ? "Passing" : "Not passing"}</span>
      <div class="label">Gate · team close rate, quarter to date</div>
      <div class="big">${pct(gc.value)}</div>
      <div class="note">Needs ${pct(gc.min)} · ${gc.sold} sold of ${gc.demos} demos${gc.pass ? "" : " · " + gc.sales_short + " sales short"}</div>
    </div>
    <div class="card gate ${gm.pass ? "" : "fail"}">
      <span class="status">${gm.pass ? "Passing" : "Not passing"}</span>
      <div class="label">Gate · gross profit %, quarter to date</div>
      <div class="big">${pct(gm.value)}</div>
      <div class="note">Needs ${pct(gm.min)} (94% of the ${pct(d.gp_goal_pct)} goal) · ${d.closed_jobs} jobs installed and closed this quarter</div>
    </div>
  </section>

  <section class="card">
    <h2>What it takes to hit each bonus</h2>
    <div class="note" style="margin:-6px 0 14px">Dollars of work are job value, what the customer pays. Only jobs installed by ${end} count this quarter. The bonus only pays if both gates pass.${gatesOk ? "" : " Right now one does not."}</div>
    <div class="tiers">${rows}</div>
  </section>

  <section class="card">
    <h2>What needs to happen</h2>
    <ul class="todo">${todo.map(x => "<li>" + x + "</li>").join("")}</ul>
  </section>

  <section class="card src">
    <div class="label" style="margin-bottom:6px">Where the numbers come from</div>
    ${src}
    <p style="margin:10px 0 0">Gross profit counts jobs installed this quarter (Completed date in AccuLynx). Actual is profit on installed jobs that are Closed, so the profit is final. Estimate is installed jobs that aren't Closed yet, figured at the ${pct(gm.value)} margin the closed ones are running. When a month's P&L closes (by the 20th of the next month), the P&L number replaces that month and its estimate goes away. The bonus is paid on the P&L. Close rate is approvals divided by demos for the sales team reps only.</p>
  </section>`;
}

let loaded = false;
function load() {
  fetch("data/gp.json?t=" + Date.now(), { cache: "no-store" })
    .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(d => { render(d); loaded = true; })
    .catch(() => { if (!loaded) $("app").innerHTML = "<div class='card'>Couldn't load data/gp.json. Check that the refresh job ran.</div>"; });
}
load();
setInterval(load, 5 * 60 * 1000);
document.addEventListener("visibilitychange", () => { if (!document.hidden) load(); });
</script>
</body>
</html>
