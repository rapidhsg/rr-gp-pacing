name: Refresh gross profit pacing
on:
  schedule:
    - cron: "4,19,34,49 * * * *"   # every 15 min; only commits when the numbers change
  workflow_dispatch:
concurrency:
  group: refresh
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pandas
      - name: Build data/gp.json from rr-metrics-data
        env:
          GH_TOKEN: ${{ secrets.RR_METRICS_READ_TOKEN }}   # optional; only needed if rr-metrics-data goes private
        run: python build_gp.py
      - name: Commit new numbers
        run: |
          git config user.name "gp-pacing-bot"
          git config user.email "gp-pacing-bot@users.noreply.github.com"
          git add data/gp.json
          git diff --cached --quiet || git commit -m "Refresh gross profit pacing"
          git pull --rebase
          git push
